name: network_inspector
description: Http inspector / logger for Dio and Http package. This package would allow you to log every Http request, response, and error from Dio & Http.
version: 1.2.0-rc.1
homepage: https://github.com/Meruya-Techhnology/network_inspector

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.0.0
  dio: ^5.1.0
  sqflite: ^2.2.6
  provider: ^6.0.5
  intl: ^0.20.1
  collection: ^1.17.2
  share_plus: ^12.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/json/
